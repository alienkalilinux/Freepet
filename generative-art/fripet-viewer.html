<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warm Emergence — ФРИПЕТ Generative Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar {
            width: 320px; flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto; overflow-x: hidden;
        }
        .sidebar h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; margin-bottom: 8px; }
        .sidebar .subtitle { color: var(--anthropic-mid-gray); font-size: 14px; margin-bottom: 32px; line-height: 1.4; }
        .control-section { margin-bottom: 32px; }
        .control-section h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .control-section h3::before { content: '•'; color: var(--anthropic-orange); font-weight: bold; }
        .seed-input {
            width: 100%; background: var(--anthropic-light); padding: 12px; border-radius: 8px;
            font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray); text-align: center;
        }
        .seed-input:focus { outline: none; border-color: var(--anthropic-orange); box-shadow: 0 0 0 2px rgba(217,119,87,0.1); background: white; }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .regen-button { margin-bottom: 0; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] { flex: 1; height: 4px; background: var(--anthropic-light-gray); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; cursor: pointer; }
        .slider-container select { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--anthropic-light-gray); font-family: 'Poppins', sans-serif; font-size: 13px; }
        .value-display { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 60px; text-align: right; }
        .color-group { margin-bottom: 16px; }
        .color-group label { display: block; font-size: 12px; color: var(--anthropic-mid-gray); margin-bottom: 4px; }
        .color-picker-container { display: flex; align-items: center; gap: 8px; }
        .color-picker-container input[type="color"] { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: none; padding: 0; }
        .color-value { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); }
        .button { background: var(--anthropic-orange); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; width: 100%; margin-bottom: 8px; }
        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #canvas-container { width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(20,20,19,0.1); background: #1c1108; }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
        .loading { display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--anthropic-mid-gray); padding: 60px; }
        @media (max-width: 600px) { .container { flex-direction: column; } .sidebar { width: 100%; } .canvas-area { padding: 20px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Warm Emergence</h1>
            <div class="subtitle">Generative philosophy for ФРИПЕТ — flow-field companionship. Same seed = same artwork.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="7" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>
                <div class="control-group">
                    <label>Species</label>
                    <div class="slider-container">
                        <select id="species" onchange="updateSpecies(this.value)">
                            <option value="dog">Dog — ember</option>
                            <option value="cat" selected>Cat — amber</option>
                            <option value="hamster">Hamster — honey</option>
                            <option value="parrot">Parrot — leaf</option>
                            <option value="fish">Fish — teal</option>
                            <option value="turtle">Turtle — moss</option>
                            <option value="rabbit">Rabbit — cream</option>
                            <option value="unknown">Unknown — heart glow</option>
                        </select>
                    </div>
                </div>
                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="500" max="4000" step="100" value="1600" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">1600</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Flow Speed</label>
                    <div class="slider-container">
                        <input type="range" id="flowSpeed" min="0.2" max="2.0" step="0.1" value="0.9" oninput="updateParam('flowSpeed', this.value)">
                        <span class="value-display" id="flowSpeed-value">0.9</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Noise Scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.001" max="0.012" step="0.001" value="0.004" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.004</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Field Scale</label>
                    <div class="slider-container">
                        <input type="range" id="fieldScale" min="0.5" max="3.0" step="0.1" value="1.4" oninput="updateParam('fieldScale', this.value)">
                        <span class="value-display" id="fieldScale-value">1.4</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Trail Alpha</label>
                    <div class="slider-container">
                        <input type="range" id="trailAlpha" min="4" max="40" step="1" value="14" oninput="updateParam('trailAlpha', this.value)">
                        <span class="value-display" id="trailAlpha-value">14</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Warmth Bias (ember ↔ leaf)</label>
                    <div class="slider-container">
                        <input type="range" id="warmthBias" min="0" max="100" step="1" value="68" oninput="updateParam('warmthBias', this.value)">
                        <span class="value-display" id="warmthBias-value">68</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Colors</h3>
                <div class="color-group">
                    <label>Ember</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#fb923c" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#fb923c</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Leaf</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#34d399" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#34d399</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Cream</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#ffedd5" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#ffedd5</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <button class="button" onclick="regenerate()">Regenerate</button>
                <div class="button-row">
                    <button class="button secondary" onclick="resetParameters()">Reset</button>
                    <button class="button tertiary" onclick="downloadPNG()">↓ PNG</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container"><div class="loading">Initializing Warm Emergence…</div></div>
        </div>
    </div>

<script>
let params = {
  seed: 7,
  species: 'cat',
  particleCount: 1600,
  flowSpeed: 0.9,
  noiseScale: 0.004,
  fieldScale: 1.4,
  trailAlpha: 14,
  warmthBias: 68,
  colorPalette: ['#fb923c', '#34d399', '#ffedd5']
};
let defaultParams = JSON.parse(JSON.stringify(params));

const SPECIES_HUE = { dog: 18, cat: 32, hamster: 42, parrot: 150, fish: 172, turtle: 120, rabbit: 45, unknown: 26 };

let particles = [];
let stepsDone = 0;
const MAX_STEPS = 200;
let seedOffset = 0;

function setup() {
  let canvas = createCanvas(1000, 1000);
  canvas.parent('canvas-container');
  pixelDensity(Math.min(2, window.devicePixelRatio || 1));
  initializeSystem();
  const l = document.querySelector('.loading');
  if (l) l.style.display = 'none';
}

function initializeSystem() {
  randomSeed(params.seed);
  noiseSeed(params.seed);
  seedOffset = (params.seed * 0.137) % 100;
  stepsDone = 0;
  particles = [];
  for (let i = 0; i < params.particleCount; i++) particles.push(new Particle(true));
  paintBase();
  loop();
}

function paintBase() {
  background(28, 17, 8);
  noStroke();
  // ember glow top-left
  for (let r = 520; r > 0; r -= 26) {
    const a = 10 * (1 - r / 520);
    fill(249, 115, 22, a * 0.55);
    circle(width * 0.18, height * 0.10, r * 2);
  }
  // leaf glow top-right
  for (let r = 460; r > 0; r -= 26) {
    const a = 9 * (1 - r / 460);
    fill(16, 185, 129, a * 0.5);
    circle(width * 0.86, height * 0.12, r * 2);
  }
  // deep warm glow bottom
  for (let r = 560; r > 0; r -= 28) {
    const a = 12 * (1 - r / 560);
    fill(124, 45, 18, a * 0.5);
    circle(width * 0.5, height * 1.08, r * 2);
  }
  // dot lattice
  fill(255, 231, 189, 19);
  const gap = 28;
  for (let y = gap / 2; y < height; y += gap)
    for (let x = gap / 2; x < width; x += gap)
      circle(x, y, 2);
  // center heart-glow by species
  const hue = SPECIES_HUE[params.species] ?? 30;
  colorMode(HSB, 360, 100, 100, 255);
  for (let r = 340; r > 0; r -= 22) {
    fill(hue, 62, 96, 5 * (1 - r / 340) + 2);
    circle(width / 2, height * 0.52, r * 2);
  }
  colorMode(RGB, 255);
}

function fieldAngle(x, y) {
  const s = params.fieldScale;
  const n = noise(x * params.noiseScale + seedOffset, y * params.noiseScale - seedOffset);
  return (Math.sin(x * 0.004 * s + seedOffset) + Math.cos(y * 0.0045 * s)) * 1.2 + (n - 0.5) * TWO_PI * 1.6;
}

function draw() {
  // 3 substeps per frame
  for (let k = 0; k < 3; k++) {
    for (let p of particles) { p.update(); p.display(); }
  }
  stepsDone += 3;
  if (stepsDone >= MAX_STEPS) noLoop();
}

class Particle {
  constructor(anywhere) {
    this.respawn(anywhere);
    this.life = Math.floor(random(40, 130));
  }
  respawn(anywhere) {
    const edge = Math.floor(random(4));
    if (!anywhere || edge === 0) { this.pos = createVector(random(width), random(-20, 30)); }
    else if (edge === 1) { this.pos = createVector(random(width), random(height - 30, height + 20)); }
    else if (edge === 2) { this.pos = createVector(random(-20, 30), random(height)); }
    else { this.pos = createVector(random(width - 30, width + 20), random(height)); }
    this.prev = this.pos.copy();
    this.vel = createVector(0, 0);
    this.life = Math.floor(random(40, 130));
    this.speedJitter = random(0.7, 1.3);
  }
  update() {
    const a = fieldAngle(this.pos.x, this.pos.y);
    const sp = params.flowSpeed * this.speedJitter;
    this.vel = createVector(Math.cos(a), Math.sin(a)).mult(sp * 1.6);
    this.prev = this.pos.copy();
    this.pos.add(this.vel);
    // gentle pull to center = companionship convergence
    const c = createVector(width / 2 - this.pos.x, height * 0.52 - this.pos.y);
    this.pos.add(c.mult(0.0011));
    this.life--;
    if (this.life <= 0 || this.pos.x < -30 || this.pos.x > width + 30 || this.pos.y < -30 || this.pos.y > height + 30) this.respawn(false);
  }
  display() {
    const v = Math.min(2.2, this.vel.mag());
    const warm = params.warmthBias / 100;
    const ember = hexToRgb(params.colorPalette[0]);
    const leaf = hexToRgb(params.colorPalette[1]);
    const cream = hexToRgb(params.colorPalette[2]);
    const r = Math.round(ember.r * warm + leaf.r * (1 - warm) * 0.55 + cream.r * 0.12 * (v / 2.2));
    const g = Math.round(ember.g * warm * 0.8 + leaf.g * (1 - warm) * 0.8 + cream.g * 0.10 * (v / 2.2));
    const b = Math.round(ember.b * 0.35 * warm + leaf.b * (1 - warm) * 0.7 + cream.b * 0.10);
    stroke(Math.min(255, r), Math.min(255, g), Math.min(255, b), params.trailAlpha + v * 10);
    strokeWeight(1.25);
    line(this.prev.x, this.prev.y, this.pos.x, this.pos.y);
  }
}

function hexToRgb(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : { r: 251, g: 146, b: 60 };
}

function updateParam(name, value) {
  const num = parseFloat(value);
  params[name] = num;
  const el = document.getElementById(name + '-value');
  if (el) el.textContent = value;
  initializeSystem();
}
function updateSpecies(v) { params.species = v; initializeSystem(); }
function updateColor(id, value) {
  const idx = { color1: 0, color2: 1, color3: 2 }[id];
  params.colorPalette[idx] = value;
  document.getElementById(id + '-value').textContent = value;
  initializeSystem();
}
function regenerate() { initializeSystem(); }
function downloadPNG() { saveCanvas('fripet-warm-emergence-' + params.species + '-' + params.seed, 'png'); }

function updateSeedDisplay() { document.getElementById('seed-input').value = params.seed; }
function updateSeed() {
  const v = parseInt(document.getElementById('seed-input').value);
  if (v && v > 0) { params.seed = v; initializeSystem(); } else updateSeedDisplay();
}
function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); initializeSystem(); }
function nextSeed() { params.seed++; updateSeedDisplay(); initializeSystem(); }
function randomSeedAndUpdate() { params.seed = Math.floor(Math.random() * 999999) + 1; updateSeedDisplay(); initializeSystem(); }
function resetParameters() {
  const s = params.seed;
  params = JSON.parse(JSON.stringify(defaultParams));
  params.seed = s;
  document.getElementById('particleCount').value = params.particleCount;
  document.getElementById('particleCount-value').textContent = params.particleCount;
  document.getElementById('flowSpeed').value = params.flowSpeed;
  document.getElementById('flowSpeed-value').textContent = params.flowSpeed;
  document.getElementById('noiseScale').value = params.noiseScale;
  document.getElementById('noiseScale-value').textContent = params.noiseScale;
  document.getElementById('fieldScale').value = params.fieldScale;
  document.getElementById('fieldScale-value').textContent = params.fieldScale;
  document.getElementById('trailAlpha').value = params.trailAlpha;
  document.getElementById('trailAlpha-value').textContent = params.trailAlpha;
  document.getElementById('warmthBias').value = params.warmthBias;
  document.getElementById('warmthBias-value').textContent = params.warmthBias;
  document.getElementById('species').value = params.species;
  document.getElementById('color1').value = params.colorPalette[0];
  document.getElementById('color1-value').textContent = params.colorPalette[0];
  document.getElementById('color2').value = params.colorPalette[1];
  document.getElementById('color2-value').textContent = params.colorPalette[1];
  document.getElementById('color3').value = params.colorPalette[2];
  document.getElementById('color3-value').textContent = params.colorPalette[2];
  updateSeedDisplay();
  initializeSystem();
}
window.addEventListener('load', updateSeedDisplay);
</script>
</body>
</html>
